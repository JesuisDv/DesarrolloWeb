<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Document</title>
</head>
<body>
<div class="contenedor">
    <div class="cont1">
        <li>
            <img id="main-image" src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/001.png" alt="Bulbasaur">
            <div class="image-description">Bulbasaur - Pokémon Planta/Veneno</div>
        </li>
    </div>

    <div class="cont2">
        <li class="sub-box">
            <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/detail/001.png"
                 data-full="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/001.png"
                 data-variants='["002","003"]'
                 data-name="Bulbasaur - Pokémon Planta/Veneno" alt="Bulbasaur">
        </li>
        <li class="sub-box">
            <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/detail/004.png"
                 data-full="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/004.png"
                 data-variants='["005","006"]'
                 data-name="Charmander - Pokémon Fuego" alt="Charmander">
        </li>
        <li class="sub-box">
            <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/detail/007.png"
                 data-full="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/007.png"
                 data-variants='["008","009"]'
                 data-name="Squirtle - Pokémon Agua" alt="Squirtle">
        </li>
        <li class="sub-box">
            <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/detail/025.png"
                 data-full="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/025.png"
                 data-variants='["172" ,"026"]'
                 data-name="Pikachu - Pokémon Eléctrico" alt="Pikachu">
        </li>
    </div>

    <div class="cont3">
        <li><img id="variant1" src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/detail/002.png" alt=""></li>
        <li><img id="variant2" src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/detail/003.png" alt=""></li>
    </div>
</div>
</body>
<script src="./scripts.js"></script>
</html>
