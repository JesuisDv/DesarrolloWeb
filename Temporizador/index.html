<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Document</title>
</head>
<body>
    <div class="contenedor">
        <h1>Temporizador</h1>
        <div id="tiempoUser">
            <input type="number" id="horas" placeholder="Horas" min="0" max="23">
            <input type="number" name="" id="minutos" placeholder="Minutos" min="0" max="59">
            <input type="number" name="" id="segundos" placeholder="Segundos" min="0" max="59">
        </div>

        

        <div class="tiempo">
            <li><p>Horas</p><div class="horas">00</div></li>
            <li><p>Minutos</p><div class="minutos">00</div></li>
            <li><p>Segundos</p><div class="segundos">00</div></li>
        </div>
        <div id="botones">
            <button id="pausar">Pausar</button>
            <button id="iniciar">Iniciar</button>
            <button id="reiniciar">Reiniciar</button>
        </div>

    </div>
</body>
<script src="./scritps.js"></script>
</html>
